name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm thử bộ phân tích văn bản
        run: npm test

      - name: Đóng gói bộ cài đặt Windows 64-bit
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Tải lên file cài đặt
        uses: actions/upload-artifact@v4
        with:
          name: QLChamCong-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Phát hành (khi gắn tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
