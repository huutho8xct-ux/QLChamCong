name: Build Windows

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tạo bản phát hành với thẻ này (vd: v1.2.1). Để trống nếu chỉ build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      - name: Kiểm thử bộ phân tích văn bản
        run: npm test

      - name: Đóng gói bộ cài đặt Windows 64-bit
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Tải lên file cài đặt
        uses: actions/upload-artifact@v4
        with:
          name: QLChamCong-Windows
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Phát hành (khi gắn tag v* hoặc chạy thủ công có release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Quản lý Chấm công – Ngày phép ${{ github.event.inputs.release_tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: dist/*.exe
